<svg width="200" height="200" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0057C8"/>
      <stop offset="100%" stop-color="#1A9FFF"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A9FFF"/>
      <stop offset="100%" stop-color="#5CDD2B"/>
    </linearGradient>
    <linearGradient id="g-body" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1A9FFF"/>
      <stop offset="100%" stop-color="#0057C8"/>
    </linearGradient>
  </defs>

  <!-- Outer dashed ring -->
  <circle cx="36" cy="36" r="33" stroke="url(#g-green)" stroke-width="1" stroke-dasharray="4 5" opacity="0.5"/>

  <!-- Inner filled circle -->
  <circle cx="36" cy="36" r="27" fill="#0D1B2A"/>

  <!-- Inner border ring -->
  <circle cx="36" cy="36" r="27" stroke="url(#g-blue)" stroke-width="1.5" opacity="0.7"/>

  <!-- Head -->
  <circle cx="36" cy="20" r="5.5" fill="url(#g-body)"/>

  <!-- Torso -->
  <path d="M36 25.5 L33 38 L39 38 Z" fill="url(#g-body)" opacity="0.9"/>

  <!-- Left arm raised -->
  <line x1="36" y1="29" x2="26" y2="22" stroke="url(#g-body)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right arm raised -->
  <line x1="36" y1="29" x2="46" y2="22" stroke="url(#g-body)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left leg -->
  <line x1="33" y1="38" x2="29.5" y2="47" stroke="url(#g-body)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right leg -->
  <line x1="39" y1="38" x2="42.5" y2="47" stroke="url(#g-body)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- AI spark crown -->
  <circle cx="36" cy="11" r="3" fill="#5CDD2B"/>
  <circle cx="36" cy="11" r="1.4" fill="white"/>

  <!-- Spark rays -->
  <line x1="36" y1="7"    x2="36" y2="5"    stroke="#5CDD2B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="39.5" y1="8"  x2="41" y2="6.5"  stroke="#5CDD2B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32.5" y1="8"  x2="31" y2="6.5"  stroke="#5CDD2B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40.5" y1="11" x2="42.5" y2="11" stroke="#5CDD2B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="31.5" y1="11" x2="29.5" y2="11" stroke="#5CDD2B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Neural dots at hands -->
  <circle cx="26" cy="22" r="2" fill="#5CDD2B" opacity="0.9"/>
  <circle cx="46" cy="22" r="2" fill="#5CDD2B" opacity="0.9"/>

  <!-- Growth arc at bottom -->
  <path d="M20 54 Q36 44 52 54" stroke="url(#g-green)" stroke-width="1.2" fill="none" stroke-dasharray="3 3" opacity="0.5"/>
</svg>
